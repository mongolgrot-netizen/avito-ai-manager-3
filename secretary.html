<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b0e">
<title>AI Secretary</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f2f3f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1050px;margin:auto;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;padding:18px;background:#090b0eee;backdrop-filter:blur(14px);display:flex;justify-content:space-between;border-bottom:1px solid #20252d}.brand{font-weight:800;letter-spacing:.5px}.brand i{font-style:normal;color:#c8a66a}.online{font-size:11px;color:#8d969f}
main{padding:16px}.hero{padding:15px 2px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:#9299a2}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.card,.chat,.row{background:#111419;border:1px solid #222831;border-radius:17px}.card{padding:15px}.label{font-size:12px;color:#9299a2}.num{font-size:25px;font-weight:800;margin-top:10px}
.chat{overflow:hidden;margin-top:12px}.chathead{padding:15px;border-bottom:1px solid #222831;font-weight:700}.messages{min-height:220px;padding:15px;display:flex;flex-direction:column;gap:10px}.msg{padding:11px 13px;border-radius:14px;max-width:88%;font-size:14px;line-height:1.4}.ai{background:#1a1f26}.me{align-self:flex-end;background:#c8a66a;color:#101010}.quick{display:flex;gap:7px;overflow:auto;padding:0 12px 12px}.quick button{white-space:nowrap;background:#181c22;color:#ddd;border:1px solid #2a3038;border-radius:10px;padding:8px 10px}.input{display:flex;gap:8px;padding:12px;border-top:1px solid #222831}.input input{min-width:0;flex:1;background:#090b0e;color:#fff;border:1px solid #2a3038;border-radius:12px;padding:12px;outline:none}.input button{border:0;background:#c8a66a;border-radius:12px;width:46px;font-size:18px}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 10px}.rows{display:grid;gap:8px}.row{padding:13px;display:flex;justify-content:space-between}.row small{display:block;color:#8e969f;margin-top:4px}.badge{font-size:11px;background:#1d2922;color:#9fd0aa;padding:6px 8px;border-radius:8px;height:max-content}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0d10f7;border-top:1px solid #20252d;z-index:10}.nav{max-width:1050px;margin:auto;display:flex;justify-content:space-around;padding:8px}.nav button{background:none;border:0;color:#858d97;font-size:10px}.nav button b{display:block;font-size:18px;margin-bottom:2px}.nav button.active{color:#c8a66a}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:26px}}
</style>
</head>
<body><div class="app">
<header><div class="brand">AI <i>SECRETARY</i></div><div class="online">● ONLINE</div></header>
<main><div class="hero"><h1>Добрый вечер, Михаил</h1><p>Ваш персональный AI-секретарь и менеджер.</p></div>
<div class="grid"><div class="card"><div class="label">Новые заявки</div><div class="num">7</div></div><div class="card"><div class="label">Горячие клиенты</div><div class="num">3</div></div><div class="card"><div class="label">Задачи сегодня</div><div class="num">4</div></div><div class="card"><div class="label">КП на контроле</div><div class="num">5</div></div></div>
<div class="chat"><div class="chathead">🤖 AI-менеджер</div><div class="messages" id="messages"><div class="msg ai">Здравствуйте, Михаил. Я готов принимать поручения.</div></div>
<div class="quick"><button onclick="ask('Что у меня сегодня?')">Сегодня</button><button onclick="ask('Покажи горячие заявки')">Горячие заявки</button><button onclick="ask('Подготовь сообщение клиенту')">Сообщение</button><button onclick="ask('Создай задачу')">Задача</button></div>
<div class="input"><input id="inp" placeholder="Напишите поручение..."><button onclick="send()">➤</button></div></div>
<div class="section" id="clientsSection" style="display:none"><h2>Клиенты</h2><div class="rows" id="clients"><div class="row"><div>Загрузка клиентов…</div></div></div></div><div class="section"><h2>Ближайшие задачи</h2><div class="rows" id="tasks"><div class="row"><div>Загрузка задач…</div></div></div></div>
</main></div><nav><div class="nav"><button class="active"><b>⌂</b>Главная</button><button onclick="showClients()"><b>👥</b>Клиенты</button><button><b>✓</b>Задачи</button><button><b>▣</b>Авито</button><button><b>⚙</b>Настройки</button></div></nav>
<script>
const box=document.getElementById('messages'),inp=document.getElementById('inp');
let history=[];
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight}
function ask(t){inp.value=t;send()}
async function send(){
 const t=inp.value.trim(); if(!t)return;
 add(t,'me'); inp.value='';
 const typing=document.createElement('div'); typing.className='msg ai'; typing.textContent='Печатает…'; box.appendChild(typing);
 try{
   const r=await fetch('https://avito-manager-server.onrender.com/api/secretary/chat',{
     method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({message:t,history})
   });
   const data=await r.json(); typing.remove();
   const answer=data.answer||data.error||'Не удалось получить ответ.';
   add(answer,'ai');
   history.push({role:'user',content:t},{role:'assistant',content:answer});
   if(history.length>24) history=history.slice(-24);
 }catch(e){typing.remove();add('Не удалось связаться с сервером. Проверь, что сервер запущен на Render.','ai')}
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
async function loadTasks(){
 try{
  const r=await fetch('https://avito-manager-server.onrender.com/api/secretary/tasks');
  const d=await r.json(); const el=document.getElementById('tasks');
  if(!d.tasks||!d.tasks.length){el.innerHTML='<div class="row"><div>Задач пока нет</div></div>';return}
  el.innerHTML=d.tasks.slice(-8).reverse().map(t=>{
   const when=[t.dueDate,t.dueTime].filter(Boolean).join(' · ');
   return '<div class="row"><div>'+escapeHtml(t.title)+'<small>'+escapeHtml(when||'Без срока')+'</small></div><span class="badge">'+escapeHtml(t.priority||'задача')+'</span></div>'
  }).join('');
 }catch(e){document.getElementById('tasks').innerHTML='<div class="row"><div>Не удалось загрузить задачи</div></div>'}
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\\"':'&quot;'}[c]));}
loadTasks();
async function showClients(){
 const sec=document.getElementById('clientsSection'); sec.style.display=sec.style.display==='none'?'block':'none'; if(sec.style.display==='none')return;
 try{const r=await fetch('https://avito-manager-server.onrender.com/api/secretary/clients');const d=await r.json();const el=document.getElementById('clients');
 if(!d.clients.length){el.innerHTML='<div class="row"><div>Клиентов пока нет</div></div>';return}
 el.innerHTML=d.clients.slice().reverse().map(c=>'<div class="row"><div>'+escapeHtml(c.name)+'<small>'+escapeHtml([c.phone,c.object,c.source].filter(Boolean).join(' · '))+'</small></div><span class="badge">'+escapeHtml(c.stage)+'</span></div>').join('');
 }catch(e){document.getElementById('clients').innerHTML='<div class="row"><div>Не удалось загрузить клиентов</div></div>'}
}
</script></body></html>
